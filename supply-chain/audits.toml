
# cargo-vet audits file

[[audits.base64]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-run"
version = "0.22.1"
notes = "Read all of src/: forbid(unsafe_code), no build script, no dependencies; pure base64 encoding and decoding with no filesystem, network, process or environment access. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.base64]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-deploy"
version = "0.23.1"
notes = "Read all of src/ (the SIMD engine and the general-purpose decoder in full, the rest against 0.22.1): unsafe is confined to the SIMD engines, whose unaligned loads and stores are bounded by loop guards and whose CPU features are runtime-detected or required by an unsafe constructor; no build script, dependencies or ambient capabilities. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.deadpool]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-run"
version = "0.12.3"
notes = "Read all of src/: an async object pool with forbid(unsafe_code) and no build script; no network, filesystem, process or environment access beyond reading the CPU count for the default pool size. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.deadpool-runtime]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-run"
version = "0.1.4"
notes = "Read all of src/: a runtime-abstraction shim with forbid(unsafe_code) that wraps the timeout and spawn_blocking of tokio and async-std; no build script and no I/O. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.fs_extra]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-deploy"
version = "1.3.0"
notes = "Read all of src/ (lib.rs, dir.rs, file.rs, error.rs) and Cargo.toml and skimmed the tests: no unsafe code, no build script, no dependencies and no network, process or environment access; a thin wrapper over std::fs for copying, moving, removing and listing files, as advertised. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.idna_adapter]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-deploy"
delta = "1.2.1 -> 1.2.2"
notes = "Replaces the separate canonical combining class lookup with the is_virama of icu_normalizer and raises the icu requirements to 2.2; safe code only, no new dependencies or capabilities. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.ipnet]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-deploy"
version = "2.12.2"
notes = "No unsafe code, build script or ambient capabilities (no_std); lib, parser, mask and serde read in full, ipnet.rs and ipext.rs through every non-test panic site; the prefix parser is a bounded copy of the std parser and every deserialisation path validates the prefix length. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.once_cell]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-deploy"
version = "1.21.4"
notes = "Read all of src/: the unsafe code is confined to the cell implementations (a std-derived Once queue, CAS-based race cells, unchecked reads after Acquire checks) and is sound with correct Send and Sync bounds; no build script or ambient capabilities. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.smallvec]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-deploy"
delta = "1.15.2 -> 1.16.2"
notes = "Rewrites push into separate inline and heap paths and retain as a std-style in-place compaction with a panic guard; both unsafe paths checked for bounds, double drop and panic safety. Adds a PhantomData marker that makes may_dangle drop checking sound. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.stable_deref_trait]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-deploy"
delta = "1.2.0 -> 1.2.1"
notes = "Adds StableDeref impls for Cow over str, slices, Path, CStr and OsStr, which are sound because both Cow variants deref to an address that does not move with the Cow; gates the Arc impls on pointer atomics. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.sync_wrapper]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-deploy"
version = "1.0.2"
notes = "Read all of src/lib.rs: a no_std crate whose only unsafe is a Sync impl justified by exposing T only through &mut or ownership, plus pin projections that are sound because there is no Drop or manual Unpin impl. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.synstructure]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-deploy"
delta = "0.13.2 -> 0.14.0"
notes = "Ports to syn 3 by filling the new attrs fields and tidies two match arms; pure token manipulation with no unsafe code, build script or I/O. Read by an AI agent; the owner reviews the record in the pull request."

[[audits.wiremock]]
who = "Claude Opus 5.5 (AI agent, for Lucas Greuloch)"
criteria = "safe-to-run"
version = "0.6.5"
notes = "Read all of src/: no unsafe code, no build script; the mock server binds only 127.0.0.1 on an OS-assigned port and connects only to its own address for a readiness probe; no filesystem or process access, and it reads only the WIREMOCK_BODY_PRINT_LIMIT environment variable. Read by an AI agent; the owner reviews the record in the pull request."

