version = 1

[[annotations]]
path = [
  "**/*.md",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".gitleaks.toml",
  ".github/**",
  "corpus/public/**/expected.json",
  "gradle.properties",
  "gradle/libs.versions.toml",
  "gradle/verification-metadata.xml",
  "gradle/verification-keyring.keys",
  "gradle/wrapper/gradle-wrapper.properties",
  "**/*.lockfile",
]
precedence = "closest"
SPDX-FileCopyrightText = "Lucas Greuloch"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "NOTICE"
precedence = "override"
SPDX-FileCopyrightText = "Lucas Greuloch"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "CLA.md"
precedence = "override"
SPDX-FileCopyrightText = [
  "Lucas Greuloch",
  "The Apache Software Foundation",
]
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Organization for Ethical Source"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
  "gradlew",
  "gradlew.bat",
  "gradle/wrapper/gradle-wrapper.jar",
]
precedence = "override"
SPDX-FileCopyrightText = "2015 the original authors"
SPDX-License-Identifier = "Apache-2.0"

[[annotations]]
path = [
  "corpus/public/**/*.jpg",
  "corpus/public/**/*.jpeg",
  "corpus/public/**/*.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Cloud Imperium Rights LLC and Cloud Imperium Rights Ltd."
SPDX-License-Identifier = "LicenseRef-Game-Screenshots"

[[annotations]]
path = [
  "docs/images/fankit/*.png",
  "**/MadeByTheCommunity_*.png",
  "**/made-by-the-community*.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Cloud Imperium Rights LLC and Cloud Imperium Rights Ltd."
SPDX-License-Identifier = "LicenseRef-Fankit-Agreement"
