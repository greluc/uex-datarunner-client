version = 1

[[annotations]]
path = [
  "**/*.md",
  ".editorconfig",
  ".gitattributes",
  ".gitignore",
  ".gitleaks.toml",
  ".github/**",
  "corpus/public/**/expected.json",
  "ui/design-tokens/*.json",
  "**/Cargo.toml",
  "Cargo.lock",
  "prototype/*/Cargo.lock",
  "rust-toolchain.toml",
  "deny.toml",
  "clippy.toml",
  "rustfmt.toml",
  ".cargo/**",
  "supply-chain/**",
  "xtask/fixtures/**",
  "xtask/english-allowlist.toml",
]
precedence = "closest"
SPDX-FileCopyrightText = "Lucas Greuloch"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "NOTICE"
precedence = "override"
SPDX-FileCopyrightText = "Lucas Greuloch"
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "CLA.md"
precedence = "override"
SPDX-FileCopyrightText = [
  "Lucas Greuloch",
  "The Apache Software Foundation",
]
SPDX-License-Identifier = "GPL-3.0-or-later"

[[annotations]]
path = "CODE_OF_CONDUCT.md"
precedence = "override"
SPDX-FileCopyrightText = "Organization for Ethical Source"
SPDX-License-Identifier = "CC-BY-SA-4.0"

[[annotations]]
path = [
  "corpus/public/**/*.jpg",
  "corpus/public/**/*.jpeg",
  "corpus/public/**/*.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Cloud Imperium Rights LLC and Cloud Imperium Rights Ltd."
SPDX-License-Identifier = "LicenseRef-Game-Screenshots"

[[annotations]]
path = [
  "docs/images/fankit/*.png",
  "**/MadeByTheCommunity_*.png",
  "**/made-by-the-community*.png",
]
precedence = "override"
SPDX-FileCopyrightText = "Cloud Imperium Rights LLC and Cloud Imperium Rights Ltd."
SPDX-License-Identifier = "LicenseRef-Fankit-Agreement"
