[package]
name = "tallyline-ui-harness-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[dependencies]
egui = { version = "=0.36.2", default-features = false, features = ["default_fonts"] }
image = { version = "0.25.6", default-features = false, features = ["png"] }

[dev-dependencies]
egui_kittest = { version = "=0.36.2", default-features = false }
sha2 = { version = "0.11.0", default-features = false }

[features]
wgpu = ["egui_kittest/wgpu", "egui_kittest/snapshot"]

[lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
