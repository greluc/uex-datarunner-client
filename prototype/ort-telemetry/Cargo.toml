[package]
name = "tallyline-ort-telemetry-spike"
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
publish = false

[workspace]

[[bin]]
name = "ort-telemetry-probe"
path = "src/main.rs"

[dependencies]
ort = { version = "=2.0.0-rc.14", default-features = false, features = ["load-dynamic", "api-31"] }
sha2 = { version = "0.11.0", default-features = false }

[lints.rust]
missing_docs = "deny"
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
wildcard_enum_match_arm = "deny"
