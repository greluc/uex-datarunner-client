[workspace]
resolver = "3"
members = ["xtask", "crates/adapter-uex"]

[workspace.dependencies]
reqwest = { version = "0.13.5", default-features = false, features = ["rustls-no-provider"] }
rustls = { version = "0.23.46", default-features = false, features = ["aws-lc-rs", "std"] }
rustls-platform-verifier = { version = "0.7.1", default-features = false }
serde = { version = "1.0.228", default-features = false, features = ["derive", "std"] }
serde_json = { version = "1.0.154", default-features = false, features = ["std"] }
sha2 = { version = "0.11.1", default-features = false }
tokio = { version = "1.53.3", default-features = false }
toml = { version = "1.1.8", default-features = false, features = ["parse", "serde", "std"] }
wiremock = { version = "0.6.5", default-features = false }

[workspace.package]
edition = "2024"
rust-version = "1.99.0"
license = "GPL-3.0-or-later"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "deny"
static_mut_refs = "deny"
unused_must_use = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "deny"
invalid_rust_codeblocks = "deny"
bare_urls = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
dbg_macro = "deny"
print_stdout = "deny"
print_stderr = "deny"
indexing_slicing = "deny"
let_underscore_must_use = "deny"
allow_attributes_without_reason = "deny"
wildcard_enum_match_arm = "deny"
match_wildcard_for_single_variants = "deny"
fn_params_excessive_bools = "deny"
struct_excessive_bools = "deny"
missing_errors_doc = "deny"
missing_panics_doc = "deny"
missing_safety_doc = "deny"
