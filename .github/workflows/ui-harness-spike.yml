name: UI harness spike

on:
  push:
    branches:
      - prototype/ui-test-harness

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  SPIKE_MANIFEST: prototype/ui-test-harness/Cargo.toml

jobs:
  spike:
    name: spike (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Verify the compiler reports the pinned version
        shell: bash
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          test -n "$pinned"
          test "$pinned" = "$actual"

      - name: Report the display environment
        shell: bash
        run: |
          echo "DISPLAY=${DISPLAY:-unset} WAYLAND_DISPLAY=${WAYLAND_DISPLAY:-unset}"

      - name: Run the headless tests without a renderer
        shell: bash
        run: cargo test --locked --manifest-path "$SPIKE_MANIFEST"

      - name: Install the Mesa software Vulkan driver
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers

      - name: Run the wgpu pixel test
        shell: bash
        run: cargo test --locked --manifest-path "$SPIKE_MANIFEST" --features wgpu --test render -- the_logo_is_rendered_into_pixels --nocapture

      - name: Compare the snapshot taken on Windows
        continue-on-error: true
        shell: bash
        run: cargo test --locked --manifest-path "$SPIKE_MANIFEST" --features wgpu --test render -- about_view_snapshot --nocapture
