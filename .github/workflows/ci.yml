name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  DENY_VERSION: 0.20.2
  VET_VERSION: 0.10.2

jobs:
  check:
    name: check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            deny-target: x86_64-pc-windows-msvc
            deny-sha256: 975a22143262fd27476d19ee00c7af67978426e40e1dee94eed6bbade1cf87dc
          - os: ubuntu-latest
            deny-target: x86_64-unknown-linux-musl
            deny-sha256: 9f12ed4c49936e09b48bf862b595cde2fe64fcbd9d74dfacac6131ca824c8d5f
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        shell: bash
        run: rustup toolchain install

      - name: Verify the compiler reports the pinned version
        shell: bash
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          test -n "$pinned"
          test "$pinned" = "$actual"

      - name: Install cargo-deny at the pinned version
        shell: bash
        env:
          DENY_TARGET: ${{ matrix.deny-target }}
          DENY_SHA256: ${{ matrix.deny-sha256 }}
        run: |
          cd "$RUNNER_TEMP"
          archive="cargo-deny-${DENY_VERSION}-${DENY_TARGET}.tar.gz"
          curl --fail --silent --show-error --location --output "$archive" "https://github.com/EmbarkStudios/cargo-deny/releases/download/${DENY_VERSION}/${archive}"
          echo "${DENY_SHA256}  ${archive}" | sha256sum --check -
          mkdir cargo-deny
          tar -xzf "$archive" -C cargo-deny --strip-components=1
          echo "$RUNNER_TEMP/cargo-deny" >> "$GITHUB_PATH"

      - name: Verify cargo-deny reports the pinned version
        shell: bash
        run: test "$(cargo-deny --version)" = "cargo-deny ${DENY_VERSION}"

      - name: Guard the supply-chain configuration
        run: cargo xtask guard

      - name: Verify the vendor hash list against a clean vendor
        run: cargo xtask vendor-hashes verify

      - name: Collect the notices directory
        run: cargo xtask notices

      - name: Run the gate
        run: cargo xtask check

  vet:
    name: cargo-vet
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Verify the compiler reports the pinned version
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          test -n "$pinned"
          test "$pinned" = "$actual"

      - name: Guard the supply-chain configuration
        run: cargo xtask guard

      - name: Install cargo-vet at the pinned version
        run: cargo install --locked --version "=${VET_VERSION}" cargo-vet

      - name: Verify cargo-vet reports the pinned version
        run: test "$(cargo vet --version)" = "cargo-vet ${VET_VERSION}"

      - name: Check the dependency graph against the audits
        run: cargo vet --locked
