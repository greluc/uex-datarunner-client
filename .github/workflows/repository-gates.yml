name: Repository gates

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned gitleaks
        run: |
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl --fail --retry 3 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$archive"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/gitleaks"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP/gitleaks" gitleaks
          echo "$RUNNER_TEMP/gitleaks" >> "$GITHUB_PATH"

      - name: Scan the history for secrets
        run: gitleaks git --config .gitleaks.toml --redact --no-banner --log-opts HEAD --exit-code 1 .

  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ACTIONLINT_VERSION: 1.7.12
      ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the pinned actionlint
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl --fail --retry 3 --retry-all-errors --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$archive"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          mkdir "$RUNNER_TEMP/actionlint"
          tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Lint the workflows
        run: actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the hash-locked zizmor
        run: |
          python3 -m venv "$RUNNER_TEMP/zizmor-venv"
          "$RUNNER_TEMP/zizmor-venv/bin/pip" install --require-hashes --only-binary :all: \
            --requirement .github/requirements/zizmor.txt
          echo "$RUNNER_TEMP/zizmor-venv/bin" >> "$GITHUB_PATH"

      - name: Audit the workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: zizmor --format plain .github/workflows

  codeql:
    name: CodeQL (actions)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Initialise CodeQL
        uses: github/codeql-action/init@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          languages: actions
          build-mode: none

      - name: Analyse
        uses: github/codeql-action/analyze@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee
        with:
          category: /language:actions

  dependency-review:
    name: dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Review the dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: high
          license-check: false
          comment-summary-in-pr: never

  reuse:
    name: reuse lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      REUSE_VERSION: 6.2.0
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Install the hash-locked reuse
        run: |
          python3 --version | grep --quiet '^Python 3\.12\.'
          python3 -m venv "$RUNNER_TEMP/reuse-venv"
          "$RUNNER_TEMP/reuse-venv/bin/pip" install --disable-pip-version-check --require-hashes --only-binary :all: \
            --requirement .github/requirements/reuse-build.txt
          "$RUNNER_TEMP/reuse-venv/bin/pip" install --disable-pip-version-check --require-hashes --no-build-isolation \
            --requirement .github/requirements/reuse.txt
          echo "$RUNNER_TEMP/reuse-venv/bin" >> "$GITHUB_PATH"

      - name: Verify reuse reports the pinned version
        run: test "$(reuse --version | head -n 1)" = "reuse, version ${REUSE_VERSION}"

      - name: Lint the licence information of every file
        run: reuse lint

  dco:
    name: DCO sign-off
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install the pinned Rust toolchain
        run: rustup toolchain install

      - name: Verify the compiler reports the pinned version
        run: |
          pinned=$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)
          actual=$(rustc --version | cut -d' ' -f2)
          test -n "$pinned"
          test "$pinned" = "$actual"

      - name: Check the sign-off of every pull-request commit
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: cargo xtask dco "$BASE_SHA" "$HEAD_SHA"
